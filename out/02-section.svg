Segoe UI" font-size="2.4" font-weight="400" fill="#4b5563" text-anchor="start">← юго-запад · стена кухни</text><text x="154.78359096313912" y="172.92984542211653" font-family="Segoe UI" font-size="2.4" font-weight="400" fill="#4b5563" text-anchor="end">фасад с окнами · северо-восток →</text><rect x="15" y="186" width="21.40309155766944" height="1" fill="#1d2430" stroke="#1d2430" stroke-width="0.15"/><rect x="36.40309155766944" y="186" width="21.40309155766944" height="1" fill="#fff" stroke="#1d2430" stroke-width="0.15"/><rect x="57.80618311533888" y="186" width="21.40309155766944" height="1" fill="#1d2430" stroke="#1d2430" stroke-width="0.15"/><text x="15" y="189.6" font-family="Segoe UI" font-size="2.2" font-weight="400" fill="#1d2430" text-anchor="middle">0</text><text x="36.40309155766944" y="189.6" font-family="Segoe UI" font-size="2.2" font-weight="400" fill="#1d2430" text-anchor="middle">1</text><text x="57.80618311533888" y="189.6" font-family="Segoe UI" font-size="2.2" font-weight="400" fill="#1d2430" text-anchor="middle">2</text><text x="79.20927467300832" y="189.6" font-family="Segoe UI" font-size="2.2" font-weight="400" fill="#1d2430" text-anchor="middle">3</text><text x="81.20927467300832" y="187.1" font-family="Segoe UI" font-size="2.2" font-weight="400" fill="#1d2430" text-anchor="start">м</text><line x1="15" y1="212" x2="195" y2="212" stroke="#1d2430" stroke-width="0.35"/><text x="15" y="218" font-family="Segoe UI" font-size="6.4" font-weight="700" fill="#1d2430" text-anchor="start">Разрез 1-1</text><text x="15" y="224" font-family="Segoe UI" font-size="3" font-weight="400" fill="#4b5563" text-anchor="start">Через кухню-гостиную и окно, отметки от чистого пола.</text><g transform="translate(0 230)"><rect x="15" y="-2.6" width="5" height="3.2" fill="#1d2430"/><text x="22" y="0" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="start">В разрезе: плиты перекрытия, стены, подоконная часть и перемычка</text><rect x="15" y="2.9" width="5" height="3.2" fill="#d9dbe0" stroke="#1d2430" stroke-width="0.2"/><text x="22" y="5.5" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="start">Мебель на линии разреза: стулья у обеденного стола, журнальный столик</text><rect x="15" y="8.4" width="5" height="3.2" fill="none" stroke="#b9bdc4" stroke-width="0.25"/><text x="22" y="11" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="start">За линией разреза: кухонные шкафы, тумба под ТВ</text><text x="15" y="19" font-family="Segoe UI" font-size="2.8" font-weight="600" fill="#1d2430" text-anchor="start">Высота помещения 2,70 м · плита 200 мм · окно 1,60 м в свету по высоте</text></g><text x="15" y="276" font-family="Segoe UI" font-size="2.25" font-weight="400" fill="#4b5563" text-anchor="start">Высота потолка 2,7 м и плита 200 мм со слов владельца (типовой монолит); подоконник 800 и перемычка 2400 мм приняты, на плане ЖК их нет.</text><text x="15" y="279.6" font-family="Segoe UI" font-size="2.25" font-weight="400" fill="#4b5563" text-anchor="start">Высоты мебели приняты типовыми и на чертеже цифрами не показаны. Разрез смотрит на северо-запад, вверх по листу плана.</text><line x1="15" y1="285" x2="195" y2="285" stroke="#d0d3d8" stroke-width="0.2"/><text x="15" y="289" font-family="Segoe UI" font-size="2.2" font-weight="400" fill="#6b7280" text-anchor="start">/section · нарисовано кодом из plan.json · разбор чертежа, не строительная экспертиза</text><text x="195" y="289" font-family="Segoe UI" font-size="2.2" font-weight="400" fill="#6b7280" text-anchor="end">ai_soidet</text></svg>