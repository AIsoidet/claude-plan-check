<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="#fff"/><text x="15" y="12" font-family="Segoe UI" font-size="2.3" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0.5">КВАРТИРА 48,1 М² · ЕКАТЕРИНБУРГ</text><text x="195" y="12" font-family="Segoe UI" font-size="2.3" font-weight="400" fill="#6b7280" text-anchor="end">06 / 06</text><line x1="15" y1="14" x2="195" y2="14" stroke="#d0d3d8" stroke-width="0.2"/><line x1="81.849" y1="84.18" x2="102.278" y2="110.32" stroke="#ece5d8" stroke-width="7" stroke-linecap="round"/><line x1="102.278" y1="110.32" x2="107.44" y2="158.146" stroke="#ece5d8" stroke-width="7" stroke-linecap="round"/><line x1="102.278" y1="110.32" x2="125.488" y2="74.821" stroke="#1d2430" stroke-width="0.35"/><line x1="102.278" y1="110.32" x2="140.759" y2="120.82" stroke="#1d2430" stroke-width="0.35"/><line x1="102.278" y1="110.32" x2="72.186" y2="123.714" stroke="#1d2430" stroke-width="0.35"/><line x1="81.849" y1="84.18" x2="57.849" y2="68.18" stroke="#1d2430" stroke-width="0.35" stroke-dasharray="1.4 1"/><circle cx="57.84912972491843" cy="68.17959272673605" r="8" fill="#fff" stroke="#1d2430" stroke-width="0.3" stroke-dasharray="1 .7"/><text x="57.84912972491843" y="69.17959272673605" font-family="Segoe UI" font-size="2.2" font-weight="700" fill="#1d2430" text-anchor="middle">ПОДЪЕЗД</text><circle cx="125.48827262293808" cy="74.82138603392451" r="20.93380955014313" fill="#c7dceb" stroke="#1d2430" stroke-width="0.3"/><text x="125.48827262293808" y="74.52138603392451" font-family="Segoe UI" font-size="3.2" font-weight="700" fill="#1d2430" text-anchor="middle">Спальня</text><text x="125.48827262293808" y="78.4213860339245" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="middle">10,41 м²</text><circle cx="140.75854251618415" cy="120.81959423374913" r="18.408603524027583" fill="#c7dceb" stroke="#1d2430" stroke-width="0.3"/><text x="140.75854251618415" y="120.51959423374913" font-family="Segoe UI" font-size="3.2" font-weight="700" fill="#1d2430" text-anchor="middle">Комната</text><text x="140.75854251618415" y="124.41959423374912" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="middle">8,05 м²</text><circle cx="107.43994329046991" cy="158.1459789759479" r="26.62526552770992" fill="#f5c4b3" stroke="#1d2430" stroke-width="0.3"/><text x="107.43994329046991" y="157.8459789759479" font-family="Segoe UI" font-size="3.2" font-weight="700" fill="#1d2430" text-anchor="middle">Кухня-гостиная</text><text x="107.43994329046991" y="161.7459789759479" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="middle">16,84 м²</text><circle cx="72.18630287549384" cy="123.71392143152252" r="13.454176843105902" fill="#cfe7e4" stroke="#1d2430" stroke-width="0.3"/><text x="72.18630287549384" y="123.41392143152252" font-family="Segoe UI" font-size="3.2" font-weight="700" fill="#1d2430" text-anchor="middle">Санузел</text><text x="72.18630287549384" y="127.31392143152252" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="middle">4,30 м²</text><circle cx="81.84912972491843" cy="84.17959272673605" r="11.69673321724363" fill="#ece5d8" stroke="#1d2430" stroke-width="0.3"/><text x="81.84912972491843" y="83.87959272673605" font-family="Segoe UI" font-size="3.2" font-weight="700" fill="#1d2430" text-anchor="middle">Прихожая</text><text x="81.84912972491843" y="87.77959272673604" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="middle">3,25 м²</text><circle cx="102.27780896999558" cy="110.31952659811988" r="14.47896690341115" fill="#ece5d8" stroke="#1d2430" stroke-width="0.3"/><text x="102.27780896999558" y="110.01952659811988" font-family="Segoe UI" font-size="3.2" font-weight="700" fill="#1d2430" text-anchor="middle">Коридор</text><text x="102.27780896999558" y="113.91952659811987" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="middle">4,98 м²</text><line x1="15" y1="212" x2="195" y2="212" stroke="#1d2430" stroke-width="0.35"/><text x="15" y="218" font-family="Segoe UI" font-size="6.4" font-weight="700" fill="#1d2430" text-anchor="start">Пузырьковая схема</text><text x="15" y="224" font-family="Segoe UI" font-size="3" font-weight="400" fill="#4b5563" text-anchor="start">Размер пузыря по площади, линии по дверям, полосы там, где стены нет.</text><g transform="translate(0 230)"><circle cx="17.5" cy="-0.9" r="2" fill="#c7dceb" stroke="#1d2430" stroke-width="0.2"/><text x="22" y="0" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="start">Ночь</text><circle cx="109.5" cy="-0.9" r="2" fill="#f5c4b3" stroke="#1d2430" stroke-width="0.2"/><text x="114" y="0" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="start">День</text><circle cx="17.5" cy="4.6" r="2" fill="#cfe7e4" stroke="#1d2430" stroke-width="0.2"/><text x="22" y="5.5" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="start">Мокрые</text><circle cx="109.5" cy="4.6" r="2" fill="#ece5d8" stroke="#1d2430" stroke-width="0.2"/><text x="114" y="5.5" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="start">Коммуникации</text><line x1="15" y1="14" x2="22" y2="14" stroke="#1d2430" stroke-width="0.35"/><text x="25" y="15" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="start">Дверь между помещениями</text><text x="105" y="15" font-family="Segoe UI" font-size="2.8" font-weight="700" fill="#1d2430" text-anchor="end">3</text><line x1="15" y1="19.5" x2="22" y2="19.5" stroke="#ece5d8" stroke-width="3"/><text x="25" y="20.5" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="start">Открытая связь, без стены</text><text x="105" y="20.5" font-family="Segoe UI" font-size="2.8" font-weight="700" fill="#1d2430" text-anchor="end">2</text><line x1="15" y1="25" x2="22" y2="25" stroke="#1d2430" stroke-width="0.35" stroke-dasharray="1.4 1"/><text x="25" y="26" font-family="Segoe UI" font-size="2.8" font-weight="400" fill="#1d2430" text-anchor="start">Входная дверь</text><text x="105" y="26" font-family="Segoe UI" font-size="2.8" font-weight="700" fill="#1d2430" text-anchor="end">1</text><rect x="15" y="30.3" width="10.25" height="3.6" rx="0.8" fill="#1d2430" stroke="#1d2430" stroke-width="0.25"/><text x="20.125" y="33" font-family="Segoe UI" font-size="2" font-weight="700" fill="#fff" text-anchor="middle">НОРМА</text><text x="39" y="33" font-family="Segoe UI" font-size="2.6" font-weight="400" fill="#1d2430" text-anchor="start">Жилые комнаты непроходные, СП 54 п. 5.6: у спальни и комнаты по одной двери, обе в коридор</text></g><text x="15" y="276" font-family="Segoe UI" font-size="2.25" font-weight="400" fill="#4b5563" text-anchor="start">Площадь пузыря пропорциональна площади помещения по контуру. Каждый пузырь стартует с положения комнаты на плане и раздвигается до касания.</text><text x="15" y="279.6" font-family="Segoe UI" font-size="2.25" font-weight="400" fill="#4b5563" text-anchor="start">Связи сняты с дверей plan.json: Коридор–Спальня, Коридор–Комната, Коридор–Санузел. Все жилые комнаты выходят в коридор, проходных нет.</text><text x="15" y="283.2" font-family="Segoe UI" font-size="2.25" font-weight="400" fill="#4b5563" text-anchor="start">Окна у трёх помещений, все на одном фасаде (северо-восток): спальня, комната, кухня-гостиная.</text><line x1="15" y1="285" x2="195" y2="285" stroke="#d0d3d8" stroke-width="0.2"/><text x="15" y="289" font-family="Segoe UI" font-size="2.2" font-weight="400" fill="#6b7280" text-anchor="start">/bubble · нарисовано кодом из plan.json · разбор чертежа, не строительная экспертиза</text><text x="195" y="289" font-family="Segoe UI" font-size="2.2" font-weight="400" fill="#6b7280" text-anchor="end">ai_soidet</text></svg>